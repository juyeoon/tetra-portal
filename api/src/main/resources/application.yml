# 키와 ${ENV_NAME} 참조만 둔다. 환경별 값·비밀 값은 환경 변수로 주입한다(ECS 태스크 정의 — 인프라 약속 4절).
# 기본값은 비밀이 아니고 환경과 무관한 값에만 둔다.
spring:
  application:
    name: tetra-portal-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10   # 같은 RDS를 발급 API · Console과 나눠 쓴다(계획서 2-1 ①). 늘릴 때는 인프라와
  jpa:
    open-in-view: false   # 요청 시작 때 기본 스키마로 세션이 열리지 않도록 끈다 (라우팅은 트랜잭션 시작 시점에 결정)
    hibernate:
      ddl-auto: none      # 앱 계정은 DML만 — 스키마는 db-schema 저장소(Flyway)가 관리
  jackson:
    time-zone: Asia/Seoul
  lifecycle:
    timeout-per-shutdown-phase: 20s   # ALB 등록 해제 30초 · 컨테이너 stopTimeout 30초 안에 (인프라 약속 3절)
  servlet:
    multipart:
      max-file-size: 2MB      # 배너 상한 (계획서 Q4) — 넘으면 400 fields.banner
      max-request-size: 3MB   # 배너 + 신청 JSON

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # 끈다(명시). 감사 로그 ip는 앱이 원본 X-Forwarded-For의 맨 오른쪽 값(ALB가 붙인 값)으로 직접 고른다(common/audit/ClientIp).
  # framework면 ForwardedHeaderFilter가 맨 왼쪽 값(클라이언트가 바꿀 수 있음)을 remoteAddr로 쓰고 헤더를 지운다.
  # Portal 코드는 요청에서 URL · scheme을 만들지 않는다(메일 주소는 tetra.public-url, 쿠키 Secure는 고정) — 2026-11-04 확인
  forward-headers-strategy: none

# 프런트용 API 문서(/v3/api-docs, /swagger-ui.html). 기본 꺼짐, dev 등에서 API_DOCS_ENABLED=true로 켠다
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/**
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

tetra:
  env: ${TETRA_ENV}
  aws:
    region: ${AWS_REGION}
  auth:
    jwt-secret: ${PORTAL_JWT_SECRET}
  password-link:
    hmac-secret: ${PASSWORD_LINK_HMAC_SECRET}
  public-url: ${APP_PUBLIC_URL:http://localhost:5174}   # 메일 본문의 Portal 주소 (ECS: https://portal.daran.cloud)
  csv:
    presign-ttl: ${CSV_PRESIGN_TTL:PT5M}   # 발급 이력 CSV · 리포트 다운로드 링크 만료
  mail:
    # 운영 값은 ECS 환경변수(35-web). 문의 받는 주소 tetra.ops.1@gmail.com — 2026-10-19 확정(계획서 Q13)
    from: ${MAIL_FROM:Tetra <no-reply@tetraops.cloud>}
    support-to: ${MAIL_SUPPORT_TO:tetra.ops.1@gmail.com}
  # 모니터링(UI-TP-11). PROMETHEUS_URL이 비어 있으면 기동은 하고 모니터링만 stale (ECS: http://prometheus.tetra.internal:9090)
  monitoring:
    prometheus-url: ${PROMETHEUS_URL:}
    connect-timeout: ${PROMETHEUS_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${PROMETHEUS_READ_TIMEOUT:PT3S}
    cache-ttl: ${MONITORING_CACHE_TTL:PT15S}
    refresh-timeout: ${MONITORING_REFRESH_TIMEOUT:PT8S}
  event:
    # 이벤트 주소 {slug}.{tenant_id}.{root-domain} — 플랫폼 도메인. 테넌트 root_domain(고객사 도메인)과 다르다
    root-domain: ${EVENT_ROOT_DOMAIN:tetraops.cloud}
  apply:
    # 신청(WF1-1) 뒤 배너 업로드가 이 시간 넘게 끝나지 않으면(태스크 재시작 등) APPLY_FAILED로 정리 (계획서 Q4)
    stale-after: PT10M
    sweep-enabled: true
